<!doctype html>
<html lang="en" class="intro-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple Ligue 1 match predictions and recent form." />
    <meta name="theme-color" content="#f3f4ef" />
    <title>PredictionFoot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/football-3d.png" as="image" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro-wordmark">Prediction<span>Foot.</span></div>
      <img id="intro-ball" src="/assets/football-3d.png" alt="" />
    </div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="PredictionFoot home">
        Prediction<span>Foot.</span>
      </a>
      <div class="season">
        <span aria-hidden="true"></span>
        Ligue 1 · 2025/26
      </div>
    </header>

    <main>
      <div class="page-title">
        <div>
          <p>Matchday forecast</p>
          <h1>Ligue 1 predictor</h1>
        </div>
        <img id="header-ball" src="/assets/football-3d.png" alt="" aria-hidden="true" />
      </div>

      <section class="match-card" id="match-card" aria-label="Choose a fixture">
        <article class="team-panel">
          <span class="venue-label">Home</span>

          <div class="team-identity">
            <div class="club-crest" id="home-crest">
              <img src="" alt="" />
              <span class="crest-fallback">PSG</span>
            </div>
            <label for="home-team">Home team</label>
            <div class="select-wrap">
              <select id="home-team" name="home_team" required disabled>
                <option>Loading…</option>
              </select>
              <span aria-hidden="true">⌄</span>
            </div>
          </div>

          <div class="recent-form">
            <p>Last 5</p>
            <ol id="home-form" aria-label="Home team last five matches"></ol>
          </div>
        </article>

        <div class="versus">
          <span aria-hidden="true">VS</span>
          <button
            id="swap-teams"
            type="button"
            aria-label="Swap home and away teams"
            title="Swap teams"
          >
            ⇄
          </button>
        </div>

        <article class="team-panel">
          <span class="venue-label">Away</span>

          <div class="team-identity">
            <div class="club-crest" id="away-crest">
              <img src="" alt="" />
              <span class="crest-fallback">OM</span>
            </div>
            <label for="away-team">Away team</label>
            <div class="select-wrap">
              <select id="away-team" name="away_team" required disabled>
                <option>Loading…</option>
              </select>
              <span aria-hidden="true">⌄</span>
            </div>
          </div>

          <div class="recent-form">
            <p>Last 5</p>
            <ol id="away-form" aria-label="Away team last five matches"></ol>
          </div>
        </article>
      </section>

      <div id="form-error" class="error-message" role="alert" hidden></div>

      <section
        id="results"
        class="prediction-card"
        aria-labelledby="prediction-title"
        aria-live="polite"
        hidden
      >
        <div class="verdict">
          <span>Prediction</span>
          <h2 id="prediction-title"></h2>
        </div>

        <div class="probabilities">
          <div class="probability" data-outcome="home">
            <div><span id="home-result-label">Home</span><strong id="home-probability">0%</strong></div>
            <div class="bar"><span id="home-bar"></span></div>
          </div>
          <div class="probability" data-outcome="draw">
            <div><span>Draw</span><strong id="draw-probability">0%</strong></div>
            <div class="bar"><span id="draw-bar"></span></div>
          </div>
          <div class="probability" data-outcome="away">
            <div><span id="away-result-label">Away</span><strong id="away-probability">0%</strong></div>
            <div class="bar"><span id="away-bar"></span></div>
          </div>
        </div>
      </section>
    </main>

    <footer>PredictionFoot · Ligue 1</footer>

    <noscript><style>.intro { display: none !important; } html, body { overflow: auto !important; }</style></noscript>
  </body>
</html>
